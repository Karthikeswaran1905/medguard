org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cache tries to store paths relative to the
# project dir, including for plugin sources that live under the pub cache
# (~/AppData/Local/Pub/Cache on Windows). When the project and the pub
# cache are on different drive letters (e.g. project on D:, pub cache on
# C:), that relativization throws — "this and base files have different
# roots" — and crashes the whole compileDebugKotlin task for any plugin
# with Kotlin sources (cloud_functions, image_picker_android, etc.), even
# though nothing is actually wrong with those plugins or this project's
# own code. Disabling incremental compilation avoids that path math
# entirely; the cost is a slightly slower first build after `flutter
# clean`, not a correctness issue.
kotlin.incremental=false
